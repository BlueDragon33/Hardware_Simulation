name: HS-G0 final closeout gap evidence
on:
  push:
    branches: [fix/hs-g0-final-closeout-20261125]
permissions:
  contents: read
concurrency:
  group: hs-g0-final-closeout
  cancel-in-progress: false
jobs:
  gaps:
    if: ${{ ! github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify revision and build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'SHA_MISMATCH' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAIL' }
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAIL' }
          git diff --exit-code -- archive/source_bundle
      - name: Verify archive recovery and changed CSS assertion
        shell: pwsh
        run: |
          python -m unittest discover -s tests/archive -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'ARCHIVE_TEST_FAIL' }
          python -m unittest discover -s tests/runtime -p 'test_offline_runtime_build.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'RUNTIME_TEST_FAIL' }
      - name: Recover intentionally incomplete generated output
        shell: pwsh
        run: |
          # Only workflow-owned generated output, never project/user/source data.
          Remove-Item runtime_dist/vendor/three-runtime.iife.js
          Remove-Item runtime_dist/index.html
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { throw 'RECOVERY_FAIL' }
          python -m unittest discover -s tests/runtime -p 'test_offline_runtime_build.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'RECOVERY_TEST_FAIL' }
          git diff --exit-code -- archive/source_bundle
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Observe real gap cases (fail-closed)
        id: browser_gaps
        run: python tests/acceptance/fc02_gap_qa.py
      - name: Affected Three.js visual and camera regression
        if: ${{ !cancelled() && steps.browser_gaps.outcome != 'skipped' }}
        shell: pwsh
        run: |
          python tests/acceptance/visual_p0_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'P0_REGRESSION_FAIL' }
          python tests/acceptance/keyboard_camera_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'CAMERA_REGRESSION_FAIL' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HS-G0-FC02-gap-evidence
          path: |
            tests/fc02_output/
            tests/visual_output/
            tests/camera_output/
          if-no-files-found: warn
          retention-days: 3
