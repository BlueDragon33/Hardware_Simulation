name: Universal Constitution Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitution:
    uses: BlueDragon33/Software-Blueprint-Hub/.github/workflows/constitution-compliance.yml@main

  dependency-sovereignty:
    name: Constitution 1.2 dependency sovereignty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local simulation authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          a=json.loads(Path(".blueprint/constitution-adoption.json").read_text())
          b=json.loads(Path(".blueprint/dependency-budget.json").read_text())

          assert a["policyVersion"]=="1.2.0"
          assert "operational-sovereignty-dependency-minimization" in a["inheritedPillars"]
          assert b["policyVersion"]=="1.2.0"
          assert b["projectId"]==a["projectId"]
          assert b["posture"]=="LOCAL_CORE"

          forbidden=set(b.get("forbidden",[]))
          assert {"cloud-required-basic-simulation","remote-renderer-as-simulation-truth","ai-owned-electrical-model-truth"} <= forbidden
          print("Hardware Simulation Constitution 1.2 sovereignty: PASS")
          PY
