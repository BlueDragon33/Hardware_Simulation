name: HS-G0-P1 hardware reference and paired render benchmark
on:
  push:
    branches:
      - feat/hs-g0-p1-hardware-fidelity-20261124
permissions:
  contents: read
concurrency:
  group: hs-g0-p1-windows
  cancel-in-progress: true
jobs:
  windows-p1:
    if: ${{ ! github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 982f1f0a8fceada921c35802dd0238f6f74f01ae
          path: _p1_baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and pinned candidate runtime
        shell: pwsh
        run: |
          node --check tools/hardware_reference_geometry.js
          python -m py_compile tools/build_offline_runtime.py tests/acceptance/p1_reference_qa.py
          npm ci --no-audit --no-fund
          npm run build:offline
          git diff --exit-code -- archive/source_bundle
      - name: Exact PR15 baseline build
        working-directory: _p1_baseline
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '982f1f0a8fceada921c35802dd0238f6f74f01ae') { throw 'BASELINE_SHA_MISMATCH' }
          npm ci --no-audit --no-fund
          npm run build:offline
      - name: Runtime regression
        run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: P1 geometry and paired benchmark (3 sizes, 3 samples)
        run: python tests/acceptance/p1_reference_qa.py
      - name: P0 visual regression
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python tests/acceptance/visual_p0_qa.py
      - name: Camera keyboard and pointer regression
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python tests/acceptance/keyboard_camera_qa.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-P1-windows-evidence
          path: |
            tests/p1_output/
            tests/visual_output/
            tests/camera_output/
          if-no-files-found: warn
          retention-days: 3
