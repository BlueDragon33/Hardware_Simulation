name: HS-G0-V01 Windows visual framing and label QA

on:
  push:
    branches:
      - fix/hs-g0-v01-framing-labels-20261124
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hs-g0-v01-visual-windows
  cancel-in-progress: true

jobs:
  v01-windows:
    runs-on: windows-2025
    timeout-minutes: 18
    if: ${{ ! github.event.repository.private }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and deterministic dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          node --check tools/visual_framing_labels.js
          node --check tools/keyboard_camera.js
          python -m py_compile tools/build_offline_runtime.py tests/acceptance/visual_p0_qa.py
      - name: Build verified source runtime and preserve historical archive
        shell: pwsh
        run: |
          npm run build:offline
          git diff --exit-code -- archive/source_bundle
      - name: Run eight existing plus new generated-runtime regression
        shell: pwsh
        run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Install real Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Measure Three.js P0 at 1440 800 390 with real screenshot evidence
        shell: pwsh
        run: python tests/acceptance/visual_p0_qa.py
      - name: Verify 3x3 keyboard and pointer camera regression
        shell: pwsh
        run: python tests/acceptance/keyboard_camera_qa.py
      - name: Preserve P0 screenshot and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-V01-visual-p0-windows-evidence
          path: tests/visual_output/
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve camera regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-V01-camera-regression-evidence
          path: tests/camera_output/
          if-no-files-found: warn
          retention-days: 3
