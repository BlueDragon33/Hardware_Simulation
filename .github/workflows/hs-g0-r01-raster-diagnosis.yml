name: HS-G0-R01 tablet raster diagnosis only
on:
  push:
    branches:
      - qa/hs-g0-r01-800-raster-diagnosis-20261124
permissions:
  contents: read
concurrency:
  group: hs-g0-r01-tablet-diagnosis
  cancel-in-progress: true
jobs:
  diagnose:
    if: ${{ ! github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 74ab9b217257ed000c33bac21fed0fca73741339
          path: _diag_baseline
      - uses: actions/checkout@v4
        with:
          ref: 2d6349a548abf711e942bb2d2e6f2de77d6dda41
          path: _diag_candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact unchanged runtime builds
        shell: pwsh
        run: |
          foreach ($item in @(@{dir='_diag_baseline';sha='74ab9b217257ed000c33bac21fed0fca73741339'},@{dir='_diag_candidate';sha='2d6349a548abf711e942bb2d2e6f2de77d6dda41'})) {
            Push-Location $item.dir
            try {
              if ((git rev-parse HEAD) -ne $item.sha) { throw 'SHA_MISMATCH' }
              npm ci --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAIL' }
              npm run build:offline
              if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAIL' }
              git diff --exit-code -- archive/source_bundle
              if ($LASTEXITCODE -ne 0) { throw 'ARCHIVE_CHANGED' }
            } finally { Pop-Location }
          }
      - name: Install same Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Controlled 800px only diagnosis
        run: python tests/acceptance/r01_raster_diagnosis.py
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-R01-raster-diagnosis
          path: tests/r01_diagnosis/
          if-no-files-found: warn
          retention-days: 3
