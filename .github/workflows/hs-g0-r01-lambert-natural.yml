name: HS-G0-R01 natural render Lambert acceptance
on:
  push:
    branches:
      - fix/hs-g0-r01-abs-lambert-20261125
permissions:
  contents: read
concurrency:
  group: hs-g0-r01-lambert-natural
  cancel-in-progress: true
jobs:
  confirm:
    if: ${{ ! github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 74ab9b217257ed000c33bac21fed0fca73741339
          path: _natural_baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _natural_candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact unchanged runtime revisions
        shell: pwsh
        run: |
          foreach ($item in @(@{dir='_natural_baseline';sha='74ab9b217257ed000c33bac21fed0fca73741339'},@{dir='_natural_candidate';sha='${{ github.sha }}'})) {
            Push-Location $item.dir
            try {
              if ((git rev-parse HEAD) -ne $item.sha) { throw 'SHA_MISMATCH' }
              npm ci --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAIL' }
              npm run build:offline
              if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAIL' }
              git diff --exit-code -- archive/source_bundle
              if ($LASTEXITCODE -ne 0) { throw 'ARCHIVE_CHANGED' }
            } finally { Pop-Location }
          }
      - name: Install same Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Balanced natural-loop 800px material acceptance
        run: python tests/acceptance/r01_lambert_natural.py
      - name: Prepare baseline for affected full R01 regression
        shell: pwsh
        run: |
          Move-Item _natural_baseline _r01_baseline
          npm ci --no-audit --no-fund
          npm run build:offline
      - name: Affected R01 focus and 3-size paired regression
        run: python tests/acceptance/p1_r01_inspection_qa.py
      - name: P0 visual regression
        run: python tests/acceptance/visual_p0_qa.py
      - name: Camera regression
        run: python tests/acceptance/keyboard_camera_qa.py
      - name: Runtime regression
        run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Preserve all samples and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-R01-lambert-natural
          path: |
            tests/r01_lambert_natural/
            tests/r01_output/
            tests/visual_output/
            tests/camera_output/
          if-no-files-found: error
          retention-days: 3
