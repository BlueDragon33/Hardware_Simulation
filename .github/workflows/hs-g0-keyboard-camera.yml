name: HS-G0-001 keyboard-camera Windows QA (no G1 approval)

on:
  push:
    branches:
      - fix/hs-g0-001-keyboard-camera-20261124
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hs-g0-001-camera-a11y
  cancel-in-progress: true

jobs:
  windows-camera:
    name: Real keyboard/pointer camera + offline regression
    if: ${{ ! github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use pinned dependencies and verify bridge syntax
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          node --check tools/keyboard_camera.js
          python -m py_compile tools/build_offline_runtime.py tests/acceptance/keyboard_camera_qa.py
      - name: Rebuild source-locked offline runtime
        shell: pwsh
        run: |
          npm run build:offline
          git diff --exit-code -- archive/source_bundle
      - name: Execute generated runtime regression
        shell: pwsh
        run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Install real Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Real Chromium 3x3 keyboard orbit pan zoom Escape and pointer regression
        shell: pwsh
        run: python tests/acceptance/keyboard_camera_qa.py
      - name: Preserve real camera screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HS-G0-keyboard-camera-windows-evidence
          path: tests/camera_output/
          if-no-files-found: warn
          retention-days: 3
